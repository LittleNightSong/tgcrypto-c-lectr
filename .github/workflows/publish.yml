name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Build distributions
        run: |
          python -m pip install -U build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One native runner per architecture: cibuildwheel builds and tests
        # each wheel on its own arch, so no emulation or cross-compiling.
        os:
          - ubuntu-latest        # Linux x86_64
          - ubuntu-24.04-arm     # Linux aarch64
          - windows-latest       # Windows AMD64
          - macos-15-intel       # macOS x86_64
          - macos-latest         # macOS arm64

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel[uv]==4.2.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  android-wheels:
    name: Build wheels on ubuntu-22.04 for Android
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel[uv]==4.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build wheels
        run: python -m cibuildwheel --platform android --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-android
          path: wheelhouse/*.whl

  publish:
    name: Publish tgcrypto-c-lectr to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tgcrypto-c-lectr
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Check distribution metadata
        run: |
          python -m pip install -U twine
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
