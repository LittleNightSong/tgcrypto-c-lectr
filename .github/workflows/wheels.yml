name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install -U build

      - name: Build sdist
        run: python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  build_android_wheels:
    name: Build wheels on ubuntu-22.04 for Android
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel and uv
        run: python -m pip install cibuildwheel[uv]==4.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-ubuntu-22.04-Android
          path: ./wheelhouse/*.whl

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One native runner per architecture: cibuildwheel builds and tests
        # each wheel on its own arch, so no emulation or cross-compiling.
        os:
          - ubuntu-22.04        # Linux x86_64
          - ubuntu-24.04-arm     # Linux aarch64
          - windows-latest      # Windows AMD64
          - macos-15-intel       # macOS x86_64
          - macos-latest         # macOS arm64

    steps:
      - uses: actions/checkout@v6

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6

      - name: Install cibuildwheel and uv
        run: python -m pip install cibuildwheel[uv]==4.2.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

