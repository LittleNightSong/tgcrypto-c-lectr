[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcrypto-c-lectr"
version = "2.0.0"
description = "Fast AES-256 IGE/CTR/CBC for Telegram (Pyrogram, Kurigram) - drop-in tgcrypto replacement with AES-NI"
readme = "README.md"
requires-python = ">=3.13"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.lesser", "NOTICE"]
authors = [
    { name = "Dan", email = "dan@pyrogram.org" },
    { name = "LittleNightSong", email = "LittleNightSongYO@outlook.com"}
]
keywords = [
    "tgcrypto", "tgcrypto-c", "pyrogram", "kurigram", "telegram",
    "crypto", "cryptography", "encryption", "mtproto", "extension",
    "c-extension", "streaming", "aes", "aes-256", "aes-ni", "ige", "ctr", "cbc"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/LittleNightSong/tgcrypto-c-lectr"
Tracker = "https://github.com/LittleNightSong/tgcrypto-c-lectr/issues"
Source = "https://github.com/LittleNightSong/tgcrypto-c-lectr"

[tool.setuptools]
# The distribution ships a single top-level compiled extension module named
# ``tgcrypto`` (defined below). There are no pure-Python packages to include:
# the ``tgcrypto/`` source directory only contains the C sources and headers.
packages = []
ext-modules = [
    # Keep optimization flags opt-in via CFLAGS for local builds (see README).
    { name = "tgcrypto_lectr", sources = [
        "tgcrypto/tgcrypto.c",
        "tgcrypto/aes256.c",
        "tgcrypto/ige256.c",
        "tgcrypto/ctr256.c",
        "tgcrypto/cbc256.c"
    ] }
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-* cp314t-*"
build-frontend = "uv"

[tool.cibuildwheel.android]
archs = ['arm64_v8a', 'x86_64']
skip = "cp312-*"

[dependency-groups]
dev = [
    "cibuildwheel[uv]==4.2.0",
]
